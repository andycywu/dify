          text: "```xml\n<instruction>\nTo extract insights, identify risk and distill\
            \ key information from long reports into a single memo, follow these steps:\n\
            \n1. Begin by thoroughly reading the entire report to understand its overall\
            \ content, context, and purpose. \n\n2. Identify the key points and insights\
            \ in the report. These could be significant findings, conclusions, or\
            \ recommendations. Make sure to note any data or evidence that supports\
            \ these key points.\n\n3. Look for any potential risks mentioned in the\
            \ report. These could be challenges, threats, or obstacles that could\
            \ hinder the achievement of the objectives outlined in the report. \n\n\
            4. Distill the identified key points and risks into a concise and clear\
            \ memo. The memo should provide a summary of the report, highlighting\
            \ the main insights and risks. \n\n5. Ensure that the memo is written\
            \ in a professional and formal tone, and is easy to understand. Avoid\
            \ using jargon or technical terms without providing an explanation.\n\n\
            6. Finally, proofread the memo for any grammatical errors or inconsistencies.\
            \ \n\nRemember, the output should not contain any XML tags.\n</instruction>\n\
            \n<example>\nExample 1:\nInput: A 50-page report on the company's financial\
            \ performance for the last fiscal year.\nOutput: A one-page memo summarizing\
            \ the key findings of the report, including the company's revenue growth,\
            \ profit margins, and any potential financial risks.\n\nExample 2:\nInput:\
            \ A 100-page report on a new product development project.\nOutput: A one-page\
            \ memo summarizing the key insights from the report, including the project's\
            \ objectives, progress, challenges, and any potential risks.\n\nExample\
            \ 3:\nInput: A 200-page report on the company's market research for a\
            \ new product launch.\nOutput: A one-page memo summarizing the key findings\
            \ of the report, including the target market, consumer behavior, competition,\
            \ and any potential market risks.\n</example>\n```"
