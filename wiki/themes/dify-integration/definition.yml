key: dify-integration
title: Dify AI Integration Theme
description: Custom Wiki.js theme with integrated Dify AI chatbot and multi-frontend navigation
author: dify-team
version: 1.0.0
website: https://github.com/langgenius/dify
compatibility: ">=2.0.0"
props:
  difyApiUrl:
    type: String
    default: 'http://localhost:5001'
    title: 'Dify API URL'
    hint: 'The URL of your Dify API server'
  
  difyApiKey:
    type: String
    default: ''
    title: 'Dify API Key'
    hint: 'Your Dify API key for authentication'
    
  showFrontendSwitcher:
    type: Boolean
    default: true
    title: 'Show Frontend Switcher'
    hint: 'Display buttons to switch between different frontends'
    
  originalDifyUrl:
    type: String
    default: 'http://localhost:3000'
    title: 'Original Dify Frontend URL'
    
  nextDifyUrl:
    type: String
    default: 'http://localhost:3001'
    title: 'Dify Next Frontend URL'
    
  chatbotEnabled:
    type: Boolean
    default: true
    title: 'Enable AI Chatbot'
    hint: 'Show the floating AI chatbot widget'
