<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki.js 批量導入管理系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- 導航欄 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-cloud-upload"></i> Wiki.js 批量導入系統
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="navbar-text text-white me-3">
                            <i class="bi bi-circle-fill text-success"></i> 服務運行中
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主內容區 -->
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- 側邊欄 -->
            <div class="col-md-3 col-lg-2">
                <div class="list-group">
                    <a href="#dashboard" class="list-group-item list-group-item-action active" data-tab="dashboard">
                        <i class="bi bi-speedometer2"></i> 儀表板
                    </a>
                    <a href="#smb-config" class="list-group-item list-group-item-action" data-tab="smb-config">
                        <i class="bi bi-hdd-network"></i> SMB 配置
                    </a>
                    <a href="#sync-monitor" class="list-group-item list-group-item-action" data-tab="sync-monitor">
                        <i class="bi bi-arrow-repeat"></i> 同步監控
                    </a>
                    <a href="#batch-import" class="list-group-item list-group-item-action" data-tab="batch-import">
                        <i class="bi bi-folder2-open"></i> 批量導入
                    </a>
                    <a href="#logs" class="list-group-item list-group-item-action" data-tab="logs">
                        <i class="bi bi-journal-text"></i> 日誌查看
                    </a>
                    <a href="#settings" class="list-group-item list-group-item-action" data-tab="settings">
                        <i class="bi bi-gear"></i> 系統設置
                    </a>
                </div>
            </div>

            <!-- 內容區 -->
            <div class="col-md-9 col-lg-10">
                <!-- 儀表板 -->
                <div id="dashboard" class="tab-content active">
                    <h2 class="mb-4">系統儀表板</h2>
                    
                    <!-- 統計卡片 -->
                    <div class="row mb-4">
                        <div class="col-md-3">
                            <div class="card text-white bg-primary">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <h6 class="card-subtitle mb-2">總同步文件</h6>
                                            <h3 class="card-title mb-0" id="total-files">0</h3>
                                        </div>
                                        <i class="bi bi-file-earmark-text fs-1"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-white bg-success">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <h6 class="card-subtitle mb-2">活躍群組</h6>
                                            <h3 class="card-title mb-0" id="active-groups">0</h3>
                                        </div>
                                        <i class="bi bi-people fs-1"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-white bg-warning">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <h6 class="card-subtitle mb-2">待處理</h6>
                                            <h3 class="card-title mb-0" id="pending-files">0</h3>
                                        </div>
                                        <i class="bi bi-clock-history fs-1"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-white bg-danger">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <h6 class="card-subtitle mb-2">失敗數</h6>
                                            <h3 class="card-title mb-0" id="failed-files">0</h3>
                                        </div>
                                        <i class="bi bi-exclamation-triangle fs-1"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 群組狀態 -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">群組同步狀態</h5>
                        </div>
                        <div class="card-body">
                            <div id="group-status-container">
                                <div class="text-center text-muted py-4">
                                    <i class="bi bi-arrow-clockwise fs-1"></i>
                                    <p class="mt-2">載入中...</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 最近活動 -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">最近同步活動</h5>
                        </div>
                        <div class="card-body">
                            <div id="recent-activities">
                                <div class="text-center text-muted py-4">
                                    <i class="bi bi-inbox fs-1"></i>
                                    <p class="mt-2">暫無活動記錄</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SMB 配置 -->
                <div id="smb-config" class="tab-content">
                    <h2 class="mb-4">SMB 配置管理</h2>
                    
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <p class="text-muted mb-0">管理各群組的 SMB 共享配置</p>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSmbModal">
                            <i class="bi bi-plus-circle"></i> 新增配置
                        </button>
                    </div>

                    <div id="smb-configs-container">
                        <!-- SMB 配置列表將動態載入 -->
                    </div>
                </div>

                <!-- 同步監控 -->
                <div id="sync-monitor" class="tab-content">
                    <h2 class="mb-4">同步監控</h2>
                    
                    <div class="card mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">同步任務</h5>
                            <button class="btn btn-sm btn-success" id="refresh-sync-btn">
                                <i class="bi bi-arrow-clockwise"></i> 刷新
                            </button>
                        </div>
                        <div class="card-body">
                            <div id="sync-tasks-container">
                                <!-- 同步任務列表 -->
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">同步歷史</h5>
                        </div>
                        <div class="card-body">
                            <div id="sync-history-container">
                                <!-- 同步歷史記錄 -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 批量導入 -->
                <div id="batch-import" class="tab-content">
                    <h2 class="mb-4">批量目錄導入</h2>
                    
                    <div class="card">
                        <div class="card-body">
                            <form id="batch-import-form">
                                <div class="mb-3">
                                    <label class="form-label">源目錄路徑</label>
                                    <input type="text" class="form-control" id="source-path" 
                                           placeholder="/app/smb/EE" required>
                                    <small class="form-text text-muted">輸入容器內的目錄路徑</small>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">目標文件夾</label>
                                    <input type="text" class="form-control" id="target-folder" 
                                           placeholder="/imported/EE" required>
                                    <small class="form-text text-muted">Wiki.js 中的目標路徑</small>
                                </div>

                                <div class="mb-3">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" 
                                               id="preserve-structure" checked>
                                        <label class="form-check-label" for="preserve-structure">
                                            保留目錄結構
                                        </label>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <button type="button" class="btn btn-secondary" id="scan-directory-btn">
                                        <i class="bi bi-search"></i> 掃描目錄
                                    </button>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-upload"></i> 開始導入
                                    </button>
                                </div>
                            </form>

                            <div id="scan-results" class="mt-4" style="display: none;">
                                <h5>掃描結果</h5>
                                <div id="scan-results-content"></div>
                            </div>

                            <div id="import-progress" class="mt-4" style="display: none;">
                                <h5>導入進度</h5>
                                <div class="progress mb-3">
                                    <div class="progress-bar" id="import-progress-bar" 
                                         style="width: 0%">0%</div>
                                </div>
                                <div id="import-results-content"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 日誌查看 -->
                <div id="logs" class="tab-content">
                    <h2 class="mb-4">系統日誌</h2>
                    
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">實時日誌</h5>
                            <div>
                                <button class="btn btn-sm btn-secondary" id="clear-logs-btn">
                                    <i class="bi bi-trash"></i> 清空
                                </button>
                                <button class="btn btn-sm btn-primary" id="refresh-logs-btn">
                                    <i class="bi bi-arrow-clockwise"></i> 刷新
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div id="logs-container" class="logs-container">
                                <!-- 日誌內容 -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 系統設置 -->
                <div id="settings" class="tab-content">
                    <h2 class="mb-4">系統設置</h2>
                    
                    <div class="card">
                        <div class="card-body">
                            <form id="settings-form">
                                <h5 class="mb-3">同步設置</h5>
                                
                                <div class="mb-3">
                                    <label class="form-label">默認掃描間隔（秒）</label>
                                    <input type="number" class="form-control" id="scan-interval" 
                                           value="300" min="60">
                                    <small class="form-text text-muted">SMB 目錄掃描的間隔時間</small>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">最大並發任務數</label>
                                    <input type="number" class="form-control" id="max-concurrent" 
                                           value="3" min="1" max="10">
                                </div>

                                <div class="mb-3">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" 
                                               id="auto-sync-enabled" checked>
                                        <label class="form-check-label" for="auto-sync-enabled">
                                            啟用自動同步
                                        </label>
                                    </div>
                                </div>

                                <hr>

                                <h5 class="mb-3">通知設置</h5>
                                
                                <div class="mb-3">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" 
                                               id="email-notification">
                                        <label class="form-check-label" for="email-notification">
                                            啟用 Email 通知
                                        </label>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">通知 Email</label>
                                    <input type="email" class="form-control" id="notification-email" 
                                           placeholder="admin@example.com">
                                </div>

                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> 保存設置
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增 SMB 配置 Modal -->
    <div class="modal fade" id="addSmbModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">新增 SMB 配置</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-smb-form">
                        <div class="mb-3">
                            <label class="form-label">群組名稱 *</label>
                            <select class="form-select" id="smb-group" required>
                                <option value="">請選擇...</option>
                                <option value="Administrators">Administrators</option>
                                <option value="Guests">Guests</option>
                                <option value="EE">EE</option>
                                <option value="ME_LCM">ME_LCM</option>
                                <option value="PWR">PWR</option>
                                <option value="SW">SW</option>
                                <option value="PJM">PJM</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">SMB 路徑 *</label>
                            <input type="text" class="form-control" id="smb-path" 
                                   placeholder="/app/smb/EE" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Wiki.js 目標路徑 *</label>
                            <input type="text" class="form-control" id="wiki-target-path" 
                                   placeholder="/smb/EE" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">掃描間隔（秒）</label>
                            <input type="number" class="form-control" id="smb-scan-interval" 
                                   value="300" min="60">
                        </div>
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" 
                                       id="smb-auto-sync" checked>
                                <label class="form-check-label" for="smb-auto-sync">
                                    啟用自動同步
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="save-smb-btn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="notification-toast" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto">系統通知</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toast-message"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
