# GitGuardian 配置文件
# 這個文件定義了 GitGuardian 掃描的行為和規則

# API 設置（在 GitHub Actions 中會被環境變數覆蓋）
# api_key: YOUR_API_KEY_HERE

# 掃描設置
verbose: true
show_secrets: false
exit_zero: false
max_documents_with_secrets: 20
max_commits_for_hook: 50

# 排除的路徑模式
paths_ignore:
  # 構建和依賴目錄
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/target/**"
  - "**/.next/**"
  - "**/venv/**"
  - "**/env/**"
  - "**/__pycache__/**"
  
  # 版本控制
  - "**/.git/**"
  - "**/.svn/**"
  - "**/.hg/**"
  
  # 日誌和臨時文件
  - "**/*.log"
  - "**/*.tmp"
  - "**/tmp/**"
  - "**/temp/**"
  
  # 測試數據和示例
  - "**/test_data/**"
  - "**/fixtures/**"
  - "**/examples/**"
  - "**/samples/**"
  
  # 數據庫文件
  - "**/*.db"
  - "**/*.sqlite"
  - "**/*.sqlite3"
  
  # 壓縮文件
  - "**/*.zip"
  - "**/*.tar.gz"
  - "**/*.rar"
  - "**/*.7z"
  
  # 圖片和媒體文件
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.png"
  - "**/*.gif"
  - "**/*.svg"
  - "**/*.ico"
  - "**/*.webp"
  - "**/*.mp4"
  - "**/*.avi"
  - "**/*.mov"
  - "**/*.mp3"
  - "**/*.wav"
  
  # 字體文件
  - "**/*.ttf"
  - "**/*.otf"
  - "**/*.woff"
  - "**/*.woff2"
  
  # 證書和密鑰文件（真實的不應該在代碼庫中）
  - "**/*.pem"
  - "**/*.key"
  - "**/*.crt"
  - "**/*.cert"
  - "**/*.p12"
  - "**/*.pfx"

# 忽略特定的匹配模式
matches_ignore:
  # 測試用的假數據
  - name: "Test API Keys"
    match: "test_api_key_.*"
  - name: "Example secrets"
    match: "example_.*"
  - name: "Dummy secrets"
    match: "dummy_.*"
  - name: "Fake secrets"
    match: "fake_.*"
  - name: "Sample secrets"
    match: "sample_.*"
  - name: "Demo secrets"
    match: "demo_.*"
  - name: "Mock secrets"
    match: "mock_.*"
  
  # 常見的佔位符
  - name: "Placeholder values"
    match: "your_.*_here"
  - name: "TODO placeholders"
    match: "TODO:.*"
  - name: "FIXME placeholders"
    match: "FIXME:.*"
  
  # 開發環境的通用值
  - name: "Development secrets"
    match: "dev_.*"
  - name: "Local development"
    match: "localhost.*"
  - name: "Development database"
    match: ".*dev\\.db"

# 掃描偏好設置
secret_scan_preference: maximum_coverage

# 輸出格式設置
output_format: "text"

# IaC 掃描設置（如果支持）
iac_scan:
  enabled: true
  minimum_severity: "MEDIUM"
  
# SCA（軟體組成分析）設置（如果支持）
sca_scan:
  enabled: true
  minimum_severity: "HIGH"
