exit_zero: true
secret:
  ignored_matches:
  - match: test_api_key_.*
    name: Test API Keys
  - match: example_.*
    name: Example secrets
  - match: dummy_.*
    name: Dummy secrets
  - match: fake_.*
    name: Fake secrets
  - match: sample_.*
    name: Sample secrets
  - match: demo_.*
    name: Demo secrets
  - match: mock_.*
    name: Mock secrets
  - match: your_.*_here
    name: Placeholder values
  - match: TODO:.*
    name: TODO placeholders
  - match: FIXME:.*
    name: FIXME placeholders
  - match: dev_.*
    name: Development secrets
  - match: localhost.*
    name: Local development
  - match: .*dev\.db
    name: Development database
  ignored_paths:
  - '**/samples/**'
  - '**/*.jpeg'
  - '**/*.mp4'
  - '**/build/**'
  - '**/*.webp'
  - '**/*.woff2'
  - '**/*.svg'
  - '**/*.pfx'
  - '**/fixtures/**'
  - '**/*.jpg'
  - '**/*.log'
  - '**/*.crt'
  - '**/*.mov'
  - '**/*.gif'
  - '**/*.woff'
  - '**/dist/**'
  - '**/*.wav'
  - '**/*.sqlite'
  - '**/*.pem'
  - '**/*.p12'
  - '**/*.cert'
  - '**/*.otf'
  - '**/examples/**'
  - '**/tmp/**'
  - '**/test_data/**'
  - '**/env/**'
  - '**/*.sqlite3'
  - '**/*.7z'
  - '**/*.png'
  - '**/*.ico'
  - '**/*.rar'
  - '**/*.zip'
  - '**/temp/**'
  - '**/*.ttf'
  - '**/*.tmp'
  - '**/*.avi'
  - '**/.hg/**'
  - '**/.next/**'
  - '**/venv/**'
  - '**/*.tar.gz'
  - '**/*.db'
  - '**/node_modules/**'
  - '**/*.mp3'
  - '**/*.key'
  - '**/.svn/**'
  - '**/.git/**'
  - '**/target/**'
  - '**/__pycache__/**'
verbose: true
version: 2
