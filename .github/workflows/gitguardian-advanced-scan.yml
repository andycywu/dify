name: GitGuardian Advanced Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 每天凌晨 2 點運行一次完整掃描
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: gitguardian-advanced-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gitguardian-scan:
    name: GitGuardian Advanced Security Scan
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write
      checks: write
      pull-requests: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install GitGuardian CLI
        run: |
          pip install --upgrade pip
          pip install ggshield
          
      - name: Create GitGuardian config
        run: |
          mkdir -p ~/.gitguardian
          cat > ~/.gitguardian/config.yaml << EOF
          # GitGuardian 配置文件
          api_key: ${{ secrets.GITGUARDIAN_API_KEY }}
          
          # 自定義設置
          verbose: true
          show_secrets: false
          exit_zero: false
          
          # 忽略的路徑
          paths_ignore:
            - "**/*.log"
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/.git/**"
            - "**/venv/**"
            - "**/__pycache__/**"
            
          # 忽略的檔案類型
          matches_ignore:
            - name: "Test secrets"
              match: "test_.*"
            - name: "Example secrets"
              match: "example_.*"
              
          # 自定義檢測器設置
          secret_scan_preference: maximum_coverage
          EOF
          
      - name: Run GitGuardian Secret Scan
        id: secret-scan
        run: |
          echo "::group::GitGuardian Secret Scan"
          # 創建輸出目錄
          mkdir -p ./scan-results
          
          # 運行秘密掃描
          if ggshield secret scan repo . --json --exit-zero > ./scan-results/gitguardian-secrets.json 2>&1; then
            echo "Secret scan completed successfully"
          else
            echo "scan_failed=true" >> $GITHUB_OUTPUT
            echo "Secret scan encountered issues"
          fi
          
          # 檢查是否找到秘密
          if [ -f "./scan-results/gitguardian-secrets.json" ]; then
            secrets_count=$(jq '.total_secrets // 0' ./scan-results/gitguardian-secrets.json 2>/dev/null || echo "0")
            echo "secrets_found=$secrets_count" >> $GITHUB_OUTPUT
            echo "Found $secrets_count secrets"
          fi
          echo "::endgroup::"
          
      - name: Run GitGuardian IaC Scan
        id: iac-scan
        continue-on-error: true
        run: |
          echo "::group::GitGuardian IaC Scan"
          # 檢查是否有 IaC 文件
          if find . -name "*.tf" -o -name "*.yaml" -o -name "*.yml" -o -name "Dockerfile*" | head -1 | grep -q .; then
            echo "Found IaC files, running scan..."
            if ggshield iac scan all . --json --exit-zero > ./scan-results/gitguardian-iac.json 2>&1; then
              echo "IaC scan completed"
            else
              echo "iac_scan_failed=true" >> $GITHUB_OUTPUT
              echo "IaC scan encountered issues"
            fi
          else
            echo "No IaC files found, skipping IaC scan"
            echo '{"status": "skipped", "reason": "no_iac_files"}' > ./scan-results/gitguardian-iac.json
          fi
          echo "::endgroup::"
          
      - name: Generate SARIF Report
        if: always()
        run: |
          echo "::group::Generate SARIF Report"
          # 嘗試生成 SARIF 報告
          if ggshield secret scan repo . --format sarif --exit-zero > ./scan-results/gitguardian.sarif 2>&1; then
            echo "SARIF report generated successfully"
            # 驗證 SARIF 文件是否有效
            if [ -s "./scan-results/gitguardian.sarif" ]; then
              echo "SARIF file is valid and non-empty"
            else
              echo "SARIF file is empty, creating minimal valid SARIF"
              echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"GitGuardian","version":"1.27.0"}},"results":[]}]}' > ./scan-results/gitguardian.sarif
            fi
          else
            echo "Failed to generate SARIF, creating empty report"
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"GitGuardian","version":"1.27.0"}},"results":[]}]}' > ./scan-results/gitguardian.sarif
          fi
          echo "::endgroup::"
          
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./scan-results/gitguardian.sarif
          category: gitguardian
          
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔒 GitGuardian Security Scan Results\n\n';
            
            // 檢查秘密掃描結果
            if (fs.existsSync('./scan-results/gitguardian-secrets.json')) {
              try {
                const secretResults = JSON.parse(fs.readFileSync('./scan-results/gitguardian-secrets.json', 'utf8'));
                const totalSecrets = secretResults.total_secrets || 0;
                const filesScanned = secretResults.total_files_scanned || 0;
                
                comment += `### 🔐 Secrets Detection\n`;
                comment += `- **Files scanned**: ${filesScanned}\n`;
                comment += `- **Secrets found**: ${totalSecrets}\n\n`;
                
                if (totalSecrets > 0) {
                  comment += '⚠️ **Secrets detected in your code!** Please review and remediate.\n\n';
                } else {
                  comment += '✅ **No secrets detected.** Great job!\n\n';
                }
              } catch (error) {
                comment += '⚠️ **Could not parse secret scan results**\n\n';
              }
            } else {
              comment += '⚠️ **Secret scan results not found**\n\n';
            }
            
            // 檢查 IaC 掃描結果
            if (fs.existsSync('./scan-results/gitguardian-iac.json')) {
              comment += `### ☁️ Infrastructure as Code (IaC) Scan\n`;
              comment += `IaC scan completed. Check the detailed results in the Security tab.\n\n`;
            }
            
            comment += '---\n';
            comment += '🔍 Detailed results are available in the [Security tab](../security) of this repository.\n';
            comment += '📊 Full scan reports are uploaded as artifacts.\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          
      - name: Upload scan results as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitguardian-scan-results-${{ github.run_number }}
          path: |
            ./scan-results/
          retention-days: 30
          
      - name: Security scan summary
        if: steps.secret-scan.outputs.scan_failed == 'true' || steps.secret-scan.outputs.secrets_found != '0'
        run: |
          echo "🔍 GitGuardian Security Scan Summary"
          echo "===================================="
          
          secrets_found="${{ steps.secret-scan.outputs.secrets_found }}"
          scan_failed="${{ steps.secret-scan.outputs.scan_failed }}"
          
          if [ "$secrets_found" != "0" ] && [ "$secrets_found" != "" ]; then
            echo "⚠️  Security Alert: $secrets_found secret(s) detected!"
            echo ""
            echo "📋 Next Steps:"
            echo "1. Review the scan results in the artifacts"
            echo "2. Check the Security tab for detailed findings"
            echo "3. Remove or replace detected secrets with environment variables"
            echo "4. Consider rotating any exposed credentials"
            echo ""
            echo "💡 This is a warning, not a failure. The workflow will continue."
          elif [ "$scan_failed" == "true" ]; then
            echo "❌ Scan encountered technical issues"
            echo "Please check the workflow logs for details"
          else
            echo "✅ No security issues detected"
          fi
          
          echo ""
          echo "📊 For detailed results, check:"
          echo "- GitHub Security tab: Code scanning alerts"
          echo "- Workflow artifacts: Download scan reports"
          echo "- PR comments: Summary of findings (if applicable)"
          
      - name: Add security notice to job summary
        if: always()
        run: |
          echo "## 🔒 GitGuardian Advanced Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          secrets_found="${{ steps.secret-scan.outputs.secrets_found }}"
          scan_failed="${{ steps.secret-scan.outputs.scan_failed }}"
          
          if [ "$secrets_found" != "0" ] && [ "$secrets_found" != "" ]; then
            echo "⚠️ **Security Alert**: $secrets_found secret(s) detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Action Required:**" >> $GITHUB_STEP_SUMMARY
            echo "- Review detected secrets in the Security tab" >> $GITHUB_STEP_SUMMARY
            echo "- Remove secrets from code and use environment variables" >> $GITHUB_STEP_SUMMARY
            echo "- Rotate any exposed credentials immediately" >> $GITHUB_STEP_SUMMARY
          elif [ "$scan_failed" == "true" ]; then
            echo "❌ **Scan Issues**: Technical problems occurred during scanning" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **All Clear**: No secrets detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Resources:**" >> $GITHUB_STEP_SUMMARY
          echo "- [Security Tab](../security/code-scanning) - View detailed alerts" >> $GITHUB_STEP_SUMMARY
          echo "- [Workflow Artifacts](../actions/runs/${{ github.run_id }}) - Download reports" >> $GITHUB_STEP_SUMMARY
          echo "- [Setup Guide](../blob/main/GITGUARDIAN_SETUP_GUIDE.md) - Documentation" >> $GITHUB_STEP_SUMMARY
