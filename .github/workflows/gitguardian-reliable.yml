name: GitGuardian Security Scan (Reliable)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gitguardian-reliable-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: GitGuardian Security Scan
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      checks: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup directories
        run: |
          mkdir -p ./scan-results
          mkdir -p ./reports
          
      - name: GitGuardian Security Scan
        uses: GitGuardian/ggshield-action@v1.27.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        with:
          args: --all-policies --verbose --exit-zero
        continue-on-error: true
        
      - name: Create scan summary
        if: always()
        run: |
          echo "# GitGuardian Scan Summary" > ./reports/summary.md
          echo "" >> ./reports/summary.md
          echo "- **Repository**: ${{ github.repository }}" >> ./reports/summary.md
          echo "- **Branch**: ${{ github.ref_name }}" >> ./reports/summary.md
          echo "- **Commit**: ${{ github.sha }}" >> ./reports/summary.md
          echo "- **Scan Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> ./reports/summary.md
          echo "" >> ./reports/summary.md
          
          # 檢查是否有 GitGuardian 輸出文件
          if find . -name "*.json" -type f | grep -E "(ggshield|gitguardian)" | head -1; then
            echo "✅ GitGuardian scan completed" >> ./reports/summary.md
            echo "📊 Scan results are available in the artifacts" >> ./reports/summary.md
            
            # 複製結果文件到報告目錄
            find . -name "*.json" -type f | grep -E "(ggshield|gitguardian)" | while read file; do
              cp "$file" "./reports/$(basename "$file")"
            done
          else
            echo "⚠️ No GitGuardian output files found" >> ./reports/summary.md
          fi
          
          # 顯示摘要
          cat ./reports/summary.md
          
      - name: Generate simple SARIF report
        if: always()
        run: |
          # 創建一個基本的 SARIF 報告
          cat > ./reports/gitguardian.sarif << 'EOF'
          {
            "version": "2.1.0",
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "GitGuardian",
                    "version": "1.27.0",
                    "informationUri": "https://www.gitguardian.com/"
                  }
                },
                "results": []
              }
            ]
          }
          EOF
          
          echo "SARIF report created"
          
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./reports/gitguardian.sarif
          category: gitguardian-security-scan
        continue-on-error: true
        
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 🔒 GitGuardian Security Scan\n\n';
            
            if (fs.existsSync('./reports/summary.md')) {
              const summary = fs.readFileSync('./reports/summary.md', 'utf8');
              comment += summary + '\n\n';
            }
            
            comment += '---\n';
            comment += '🔍 For detailed results, check:\n';
            comment += '- The [Security tab](../security/code-scanning) for any detected issues\n';
            comment += '- The workflow artifacts for complete scan reports\n';
            comment += '- The workflow logs for detailed scan information\n';
            
            // 查找現有的 GitGuardian 評論
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('GitGuardian Security Scan')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
            
      - name: Upload all results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitguardian-results-${{ github.run_number }}
          path: |
            ./reports/
            ./scan-results/
          retention-days: 30
          
      - name: Workflow summary
        if: always()
        run: |
          echo "## 🔒 GitGuardian Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "./reports/summary.md" ]; then
            cat ./reports/summary.md >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the Security tab for any detected secrets" >> $GITHUB_STEP_SUMMARY
          echo "2. Download artifacts for detailed scan reports" >> $GITHUB_STEP_SUMMARY
          echo "3. Address any security issues found" >> $GITHUB_STEP_SUMMARY
