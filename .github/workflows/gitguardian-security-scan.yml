name: GitGuardian Basic Security Scan

on:
  # 在推送到主分支時運行
  push:
    branches:
      - main
  # 在 Pull Request 時運行
  pull_request:
    branches:
      - main
  # 允許手動觸發
  workflow_dispatch:

# 確保只有一個掃描作業同時運行
concurrency:
  group: gitguardian-basic-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  basic-scan:
    name: GitGuardian Basic Security Scan
    runs-on: ubuntu-latest
    
    permissions:
      # 需要讀取代碼權限
      contents: read
      # 需要寫入檢查結果權限（可選，用於在 PR 中顯示結果）
      checks: write
      # 需要寫入 Pull Request 評論權限（可選）
      pull-requests: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 獲取完整的 git 歷史，以便 GitGuardian 可以掃描所有提交
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install GitGuardian CLI
        run: |
          pip install --upgrade pip
          pip install ggshield
          
      - name: Create scan results directory
        run: |
          mkdir -p ./scan-results
          
      - name: Run GitGuardian Secret Scan
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          echo "Starting GitGuardian security scan..."
          
          # 運行基本的秘密掃描
          if ggshield secret scan repo . --json --exit-zero > ./scan-results/scan-report.json 2>&1; then
            echo "✅ GitGuardian scan completed successfully"
            
            # 檢查掃描結果
            if [ -f "./scan-results/scan-report.json" ]; then
              secrets_count=$(jq '.total_secrets // 0' ./scan-results/scan-report.json 2>/dev/null || echo "0")
              files_scanned=$(jq '.total_files_scanned // 0' ./scan-results/scan-report.json 2>/dev/null || echo "0")
              
              echo "📊 Scan Summary:"
              echo "  - Files scanned: $files_scanned"
              echo "  - Secrets found: $secrets_count"
              
              if [ "$secrets_count" -gt 0 ]; then
                echo "⚠️ Warning: $secrets_count secrets detected!"
                echo "Please review and remediate these issues."
              else
                echo "✅ No secrets detected. Great job!"
              fi
            fi
          else
            echo "❌ GitGuardian scan encountered issues"
            echo "Creating empty report for troubleshooting"
            echo '{"total_secrets": 0, "total_files_scanned": 0, "status": "error", "message": "Scan failed"}' > ./scan-results/scan-report.json
          fi
          
      - name: Generate scan summary
        if: always()
        run: |
          echo "# GitGuardian Basic Scan Results" > ./scan-results/summary.md
          echo "" >> ./scan-results/summary.md
          echo "**Repository:** ${{ github.repository }}" >> ./scan-results/summary.md
          echo "**Branch:** ${{ github.ref_name }}" >> ./scan-results/summary.md
          echo "**Commit:** ${{ github.sha }}" >> ./scan-results/summary.md
          echo "**Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> ./scan-results/summary.md
          echo "" >> ./scan-results/summary.md
          
          if [ -f "./scan-results/scan-report.json" ]; then
            secrets_count=$(jq '.total_secrets // 0' ./scan-results/scan-report.json 2>/dev/null || echo "0")
            files_scanned=$(jq '.total_files_scanned // 0' ./scan-results/scan-report.json 2>/dev/null || echo "0")
            
            echo "**Scan Results:**" >> ./scan-results/summary.md
            echo "- Files scanned: $files_scanned" >> ./scan-results/summary.md
            echo "- Secrets found: $secrets_count" >> ./scan-results/summary.md
            echo "" >> ./scan-results/summary.md
            
            if [ "$secrets_count" -gt 0 ]; then
              echo "⚠️ **Action Required:** Secrets detected in your code!" >> ./scan-results/summary.md
            else
              echo "✅ **All Clear:** No secrets detected." >> ./scan-results/summary.md
            fi
          else
            echo "❌ **Error:** Scan results not available." >> ./scan-results/summary.md
          fi
          
          echo "" >> ./scan-results/summary.md
          echo "For more details, check the workflow logs and downloaded artifacts." >> ./scan-results/summary.md
          
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitguardian-basic-scan-${{ github.run_number }}
          path: |
            ./scan-results/
          retention-days: 30
          
      - name: Add workflow summary
        if: always()
        run: |
          echo "## 🔒 GitGuardian Basic Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "./scan-results/summary.md" ]; then
            cat ./scan-results/summary.md >> $GITHUB_STEP_SUMMARY
          fi
