name: GitGuardian PR Security Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: gitguardian-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-check:
    name: Security Check for PR
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      checks: write
      
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # 只獲取 PR 的變更
          fetch-depth: 2
          
      - name: Get changed files
        id: changed-files
        run: |
          # 獲取 PR 中變更的文件
          git diff --name-only HEAD~1 HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt
          
      - name: GitGuardian Secret Scan for PR
        uses: GitGuardian/ggshield-action@v1.27.0
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        with:
          args: --all-policies --verbose --json --exit-zero
        continue-on-error: true
        
      - name: Process scan results
        id: process-results
        if: always()
        run: |
          # 創建結果目錄
          mkdir -p ./scan-results
          
          # 查找 GitGuardian 輸出文件
          if find . -name "*.json" -path "./ggshield-*" | head -1 | grep -q .; then
            # 移動找到的結果文件
            find . -name "*.json" -path "./ggshield-*" -exec cp {} ./scan-results/pr-scan-results.json \; -quit
          fi
          
          if [ -f "./scan-results/pr-scan-results.json" ]; then
            echo "Scan results found"
            # 檢查是否發現了秘密
            secrets_found=$(jq '.total_secrets // 0' ./scan-results/pr-scan-results.json 2>/dev/null || echo "0")
            echo "secrets_found=$secrets_found" >> $GITHUB_OUTPUT
            
            if [ "$secrets_found" -gt 0 ]; then
              echo "status=failed" >> $GITHUB_OUTPUT
              echo "⚠️ Found $secrets_found secrets in the PR"
            else
              echo "status=passed" >> $GITHUB_OUTPUT
              echo "✅ No secrets found in the PR"
            fi
          else
            echo "status=error" >> $GITHUB_OUTPUT
            echo "❌ Scan results not found"
          fi
          
      - name: Create or update PR comment
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const secretsFound = '${{ steps.process-results.outputs.secrets_found }}';
            const status = '${{ steps.process-results.outputs.status }}';
            
            let comment = '## 🔒 GitGuardian Security Scan Results\n\n';
            
            if (status === 'passed') {
              comment += '✅ **Security Check Passed**\n\n';
              comment += 'No secrets were detected in this Pull Request. Good job! 🎉\n\n';
            } else if (status === 'failed') {
              comment += '❌ **Security Check Failed**\n\n';
              comment += `⚠️ **${secretsFound} secret(s) detected** in this Pull Request.\n\n`;
              comment += '**Action Required:**\n';
              comment += '1. Review the detected secrets\n';
              comment += '2. Remove or replace them with environment variables\n';
              comment += '3. Consider rotating any exposed credentials\n';
              comment += '4. Push the fixes to update this PR\n\n';
            } else {
              comment += '⚠️ **Security Scan Encountered an Error**\n\n';
              comment += 'Please check the workflow logs for more details.\n\n';
            }
            
            comment += '---\n';
            comment += `🔍 **Scan Details:**\n`;
            comment += `- PR: #${{ github.event.pull_request.number }}\n`;
            comment += `- Commit: \`${{ github.event.pull_request.head.sha }}\`\n`;
            comment += `- Scanned by: GitGuardian\n\n`;
            
            if (fs.existsSync('./scan-results/pr-scan-results.json')) {
              comment += '📊 Detailed results are available in the workflow artifacts.\n';
            }
            
            // 查找現有的評論
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('GitGuardian Security Scan Results')
            );
            
            if (botComment) {
              // 更新現有評論
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // 創建新評論
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
            
      - name: Set PR status check
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const status = '${{ steps.process-results.outputs.status }}';
            const secretsFound = '${{ steps.process-results.outputs.secrets_found }}';
            
            let state, description;
            
            if (status === 'passed') {
              state = 'success';
              description = 'No secrets detected';
            } else if (status === 'failed') {
              state = 'failure';
              description = `${secretsFound} secret(s) detected`;
            } else {
              state = 'error';
              description = 'Scan encountered an error';
            }
            
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: state,
              target_url: `${context.payload.repository.html_url}/actions/runs/${context.runId}`,
              description: description,
              context: 'GitGuardian Security Check'
            });
            
      - name: Upload PR scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-security-scan-${{ github.event.pull_request.number }}
          path: |
            ./scan-results/
            ./changed_files.txt
          retention-days: 7
          
      - name: Security check summary
        if: steps.process-results.outputs.status == 'failed'
        run: |
          secrets_found="${{ steps.process-results.outputs.secrets_found }}"
          
          echo "🔍 PR Security Check Summary"
          echo "============================"
          echo "⚠️  Security Alert: $secrets_found secret(s) detected in this PR!"
          echo ""
          echo "📋 Required Actions:"
          echo "1. Review the detected secrets (check PR comments for details)"
          echo "2. Remove secrets from your code changes"
          echo "3. Use environment variables or configuration files instead"
          echo "4. Push the fixes to update this PR"
          echo ""
          echo "💡 This PR cannot be merged until security issues are resolved."
          echo "💡 Check the PR comments and workflow artifacts for detailed information."
          
          # 設置 PR 狀態但不失敗工作流
          echo "::warning title=Security Alert::$secrets_found secret(s) detected in PR. Please review and fix before merging."
          
      - name: Add PR security summary
        if: always()
        run: |
          echo "## 🔒 PR Security Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          status="${{ steps.process-results.outputs.status }}"
          secrets_found="${{ steps.process-results.outputs.secrets_found }}"
          
          if [ "$status" == "failed" ]; then
            echo "⚠️ **Security Issues Found**: $secrets_found secret(s) detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**This PR requires attention before merging:**" >> $GITHUB_STEP_SUMMARY
            echo "- Remove detected secrets from code" >> $GITHUB_STEP_SUMMARY
            echo "- Use environment variables for sensitive data" >> $GITHUB_STEP_SUMMARY
            echo "- Check PR comments for detailed findings" >> $GITHUB_STEP_SUMMARY
          elif [ "$status" == "passed" ]; then
            echo "✅ **Security Check Passed**: No secrets detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Scan Error**: Issues occurred during security scanning" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **PR Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- PR Number: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.event.pull_request.head.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- [View Artifacts](../actions/runs/${{ github.run_id }}) for detailed reports" >> $GITHUB_STEP_SUMMARY
