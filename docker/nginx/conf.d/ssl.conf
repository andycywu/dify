# Main HTTPS server (port 443) - Dify + Portal + Wiki 統一入口
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/server.crt;
    ssl_certificate_key /etc/ssl/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # --- Portal 路徑 (for new unified access pattern) ---
    location ^~ /portal/ {
      proxy_pass http://host.docker.internal:3001/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Wiki 路徑 (for new unified access pattern) ---
    location ^~ /wiki/ {
      proxy_pass http://host.docker.internal:3002/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Optional: /signin -> portal signin
    location = /signin {
      return 302 /portal/signin;
    }

    # ---- Dify default routes ----
    location /console/api { proxy_pass http://api:5001; include proxy.conf; }
    location /api         { proxy_pass http://api:5001; include proxy.conf; }
    location /v1          { proxy_pass http://api:5001; include proxy.conf; }
    location /files       { proxy_pass http://api:5001; include proxy.conf; }
    location /explore     { proxy_pass http://web:3000; include proxy.conf; }

    location /e/ {
      proxy_pass http://plugin_daemon:5002;
      proxy_set_header Dify-Hook-Url https://$host$request_uri;
      include proxy.conf;
    }

    location /mcp         { proxy_pass http://api:5001; include proxy.conf; }
    location /            { proxy_pass http://web:3000; include proxy.conf; }
}

# Dedicated HTTPS server for Portal (port 3001)
# 保留原有的 API 呼叫模式，確保內部服務的相容性
server {
    listen 3001 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/server.crt;
    ssl_certificate_key /etc/ssl/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
      proxy_pass http://host.docker.internal:3001/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
    }
}

