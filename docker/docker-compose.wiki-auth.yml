# Docker Compose Override for Wiki.js Authentication Integration
# 用於 dify-next-frontend 與 Wiki.js 認證整合

version: '3.8'

services:
  # dify-next-frontend 服務配置
  dify-next-frontend:
    environment:
      # PostgreSQL 連接 (連接到 Wiki.js 數據庫)
      - DATABASE_URL=postgresql://postgres:difyai123456@db:5432/wiki
      
      # NextAuth 配置
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dify-nextauth-secret-change-in-production}
      
      # JWT 配置 (與 Wiki.js 保持一致)
      - JWT_SECRET=${JWT_SECRET:-dify-wiki-integration-secret-key-change-in-production}
      - JWT_EXPIRES_IN=7d
      
      # Dify API 配置
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
      - API_URL=http://api:5001/api
      
      # Wiki.js GraphQL API (可選)
      - WIKI_GRAPHQL_URL=http://wiki:3000/graphql
      - WIKI_API_KEY=${WIKI_API_KEY:-}
      
    depends_on:
      - db
      - wiki
    
    # 重啟策略
    restart: unless-stopped

  # Wiki.js 服務添加認證整合環境變數
  wiki:
    environment:
      # JWT 配置 (與 dify-next-frontend 保持一致)
      - JWT_SECRET=${JWT_SECRET:-dify-wiki-integration-secret-key-change-in-production}
      - JWT_EXPIRES_IN=7d
    
    volumes:
      # 掛載認證整合模組
      - ../wiki/config/auth-integration.js:/wiki/config/auth-integration.js:ro
    
    restart: unless-stopped

  # 確保 PostgreSQL 正確配置
  db:
    environment:
      - POSTGRES_DB=wiki
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=difyai123456
    
    # 健康檢查
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wiki"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    restart: unless-stopped
